<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FP Mandate • Developer Documentation</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- Markdown Parser (Marked) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- Mermaid for Flow Diagrams -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
  <!-- Medium Zoom for Images and Diagrams -->
  <script src="https://cdn.jsdelivr.net/npm/medium-zoom/dist/medium-zoom.min.js"></script>
  <script>
    function getMermaidTheme() {
      return document.body.getAttribute('data-theme') === 'light' ? 'default' : 'dark';
    }
    if (window.mermaid) {
      mermaid.initialize({ startOnLoad: false, theme: 'dark' });
    }
  </script>

  <style>
    :root {
      --primary: #C5A059;
      --primary-light: #EFE8D8;
      --primary-hover: #D4AF37;
      --bg: #0F1115;
      --bg-sidebar: #161920;
      --bg-card: #1A1E26;
      --bg-card-hover: #222733;
      --border: #2A303C;
      --border-light: #374151;
      --text: #F3F4F6;
      --text-muted: #9CA3AF;
      --text-subtle: #6B7280;
      --accent-blue: #3B82F6;
      --accent-green: #10B981;
      --accent-amber: #F59E0B;
      --code-bg: #11141A;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.4);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --sidebar-width: 320px;
    }

    [data-theme="light"] {
      --primary: #C5A059;
      --primary-light: #F8F4EC;
      --primary-hover: #B2853E;
      --bg: #F8FAFC;
      --bg-sidebar: #FFFFFF;
      --bg-card: #FFFFFF;
      --bg-card-hover: #F1F5F9;
      --border: #E2E8F0;
      --border-light: #CBD5E1;
      --text: #0F172A;
      --text-muted: #475569;
      --text-subtle: #94A3B8;
      --code-bg: #F1F5F9;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
      line-height: 1.6;
    }

    /* ----------------------------------------------------------------------- */
    /* Sidebar Navigation                                                      */
    /* ----------------------------------------------------------------------- */
    #sidebar {
      width: var(--sidebar-width);
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      height: 100%;
      user-select: none;
    }

    .brand-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .brand-badge {
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 8px;
      background: rgba(197, 160, 89, 0.15);
      color: var(--primary);
      border: 1px solid rgba(197, 160, 89, 0.3);
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .search-box {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 10px 14px 10px 38px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 0.88rem;
      outline: none;
      transition: all 0.2s;
    }

    .search-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(197, 160, 89, 0.15);
    }

    .search-icon {
      position: absolute;
      left: 32px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-subtle);
      pointer-events: none;
    }

    .nav-list {
      flex: 1;
      overflow-y: auto;
      padding: 16px 12px;
    }

    .nav-category {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-subtle);
      padding: 16px 12px 6px 12px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s ease;
      margin-bottom: 2px;
    }

    .nav-item:hover {
      background-color: var(--bg-card);
      color: var(--text);
    }

    .nav-item.active {
      background-color: rgba(197, 160, 89, 0.12);
      color: var(--primary);
      font-weight: 600;
      border-left: 3px solid var(--primary);
    }

    .nav-item .icon {
      font-size: 1.1rem;
      width: 22px;
      text-align: center;
    }

    /* ----------------------------------------------------------------------- */
    /* Main Content Area                                                       */
    /* ----------------------------------------------------------------------- */
    #main-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }

    /* Top Action Bar (Back, Forward, Breadcrumbs, Theme Toggle) */
    .top-bar {
      height: 64px;
      border-bottom: 1px solid var(--border);
      background-color: var(--bg-sidebar);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      flex-shrink: 0;
    }

    .history-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-nav {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-nav:hover:not(:disabled) {
      background: var(--bg-card-hover);
      border-color: var(--primary);
      color: var(--primary);
    }

    .btn-nav:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .breadcrumbs {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-left: 16px;
    }

    .breadcrumbs span.current {
      color: var(--text);
      font-weight: 600;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-action {
      padding: 7px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      transition: all 0.15s;
    }

    .btn-action:hover {
      background: var(--bg-card-hover);
      border-color: var(--primary);
    }

    /* Content Pane */
    .content-pane {
      flex: 1;
      overflow-y: auto;
      padding: 40px 60px 80px 60px;
    }

    .article-container {
      max-width: 920px;
      margin: 0 auto;
    }

    /* Markdown Styling */
    .markdown-body {
      color: var(--text);
    }

    .markdown-body h1 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 24px;
      color: var(--text);
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }

    .markdown-body h2 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-top: 40px;
      margin-bottom: 16px;
      color: var(--text);
    }

    .markdown-body h3 {
      font-size: 1.2rem;
      font-weight: 600;
      margin-top: 28px;
      margin-bottom: 12px;
      color: var(--primary);
    }

    .markdown-body p {
      margin-bottom: 16px;
      font-size: 0.98rem;
      line-height: 1.7;
      color: var(--text-muted);
    }

    .markdown-body strong {
      color: var(--text);
    }

    .markdown-body a {
      color: var(--accent-blue);
      text-decoration: none;
      font-weight: 500;
    }

    .markdown-body a:hover {
      text-decoration: underline;
    }

    .markdown-body blockquote {
      border-left: 4px solid var(--primary);
      padding: 14px 20px;
      background: var(--bg-card);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      margin: 20px 0;
      color: var(--text);
    }

    .markdown-body code {
      font-family: 'JetBrains Mono', monospace;
      background-color: var(--code-bg);
      border: 1px solid var(--border);
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 0.85em;
      color: var(--primary);
    }

    .markdown-body pre {
      background-color: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 20px;
      overflow-x: auto;
      margin: 24px 0;
    }

    .markdown-body pre code {
      background-color: transparent;
      border: none;
      padding: 0;
      color: var(--text);
      font-size: 0.9rem;
    }

    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 24px 0;
      background: var(--bg-card);
      border-radius: var(--radius-md);
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .markdown-body th, .markdown-body td {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      font-size: 0.92rem;
    }

    .markdown-body th {
      background: rgba(197, 160, 89, 0.08);
      font-weight: 700;
      color: var(--text);
    }

    .markdown-body tr:last-child td {
      border-bottom: none;
    }

    .markdown-body ul, .markdown-body ol {
      margin-bottom: 20px;
      padding-left: 24px;
      color: var(--text-muted);
    }

    .markdown-body li {
      margin-bottom: 8px;
    }

    /* Bottom Back/Forth Navigation Cards */
    .bottom-nav-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 60px;
      padding-top: 32px;
      border-top: 1px solid var(--border);
    }

    .nav-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 20px 24px;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: all 0.2s;
    }

    .nav-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: var(--shadow-sm);
    }

    .nav-card.next {
      text-align: right;
    }

    .nav-card-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--text-subtle);
      letter-spacing: 0.05em;
    }

    .nav-card-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-card.next .nav-card-title {
      justify-content: flex-end;
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <aside id="sidebar">
    <div class="brand-header" onclick="loadDoc('readme')" style="cursor: pointer; transition: opacity 0.2s;" onmouseover="this.style.opacity=0.8" onmouseout="this.style.opacity=1">
      <div class="brand-title">
        <img src="assets/logo.webp" alt="FP Mandate Logo" width="26" height="26" style="border-radius: 4px;" />
        <span style="font-size: 1.15rem; font-weight: 800; letter-spacing: -0.02em;">FP Mandate</span>
        <span class="brand-badge" style="font-size: 0.65rem; padding: 3px 6px; border-radius: 4px; text-transform: uppercase;">Developer Docs</span>
      </div>
    </div>

    <div class="search-box">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="search-input" placeholder="Search documentation... (/)">
    </div>

    <div class="nav-list" id="nav-list">
      <!-- Navigation items generated by JavaScript -->
    </div>
  </aside>

  <!-- Main Container -->
  <main id="main-container">
    <!-- Top Action Bar with History Back/Forward -->
    <header class="top-bar">
      <div class="history-controls">
        <button id="btn-back" class="btn-nav" title="Go Back (Alt + Left)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
        </button>
        <button id="btn-forward" class="btn-nav" title="Go Forward (Alt + Right)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>

        <div class="breadcrumbs" id="breadcrumbs">
          <span onclick="loadDoc('readme')" style="cursor: pointer; transition: color 0.2s;" onmouseover="this.style.color='var(--primary)'" onmouseout="this.style.color=''">Docs</span>
          <span>›</span>
          <span class="current" id="breadcrumb-current">Connected Hub</span>
        </div>
      </div>

      <div class="top-actions">
        <a href="../" class="btn-action" title="Back to Main Portal">
          🏛️ <span>Portal</span>
        </a>
        <a href="../qa-docs/" class="btn-action" title="Switch to QA Testing Hub">
          🧪 <span>QA Hub</span>
        </a>
        <button id="theme-toggle" class="btn-action" title="Toggle Light/Dark Theme">
          <span id="theme-icon">🌙</span> <span id="theme-text">Dark</span>
        </button>
      </div>
    </header>

    <!-- Document Content Pane -->
    <div class="content-pane" id="content-pane">
      <div class="article-container">
        <article class="markdown-body" id="doc-content">
          <!-- Content rendered here -->
        </article>

        <!-- Bottom Prev / Next Nav Cards -->
        <nav class="bottom-nav-container" id="bottom-nav">
          <!-- Populated dynamically -->
        </nav>
      </div>
    </div>
  </main>

  <script>
    // Document Catalog
    const DOCS_CATALOG = [
      {
        id: "readme",
        title: "Connected Hub Home",
        file: "README.md",
        category: "🚀 Architecture & Standards",
        icon: "🧭"
      },
      {
        id: "project_architecture_and_flow",
        title: "Master Architecture Flow",
        file: "project_architecture_and_flow.md",
        category: "🚀 Architecture & Standards",
        icon: "🗺️"
      },
      {
        id: "theme_and_responsive_system",
        title: "Design System & Responsive",
        file: "theme_and_responsive_system.md",
        category: "🚀 Architecture & Standards",
        icon: "🎨"
      },
      {
        id: "splash",
        title: "Splash & Bootstrapping",
        file: "splash.md",
        category: "🔐 Boot & Authentication",
        icon: "⚡"
      },
      {
        id: "onboarding",
        title: "Onboarding Flow",
        file: "onboarding.md",
        category: "🔐 Boot & Authentication",
        icon: "👋"
      },
      {
        id: "auth",
        title: "Authentication & Security",
        file: "auth.md",
        category: "🔐 Boot & Authentication",
        icon: "🔒"
      },
      {
        id: "home",
        title: "Home Dashboard & Gates",
        file: "home.md",
        category: "💼 Business Operations",
        icon: "🏠"
      },
      {
        id: "mandate_checkout",
        title: "Mandate Checkout Wizard",
        file: "mandate_checkout.md",
        category: "💼 Business Operations",
        icon: "📝"
      },
      {
        id: "customer",
        title: "Customer CRM",
        file: "customer.md",
        category: "💼 Business Operations",
        icon: "👥"
      },
      {
        id: "analytics",
        title: "Analytics & Trends",
        file: "analytics.md",
        category: "💼 Business Operations",
        icon: "📊"
      },
      {
        id: "wallet",
        title: "Wallet & Coin Economy",
        file: "wallet.md",
        category: "💰 Financial Engine",
        icon: "🪙"
      },
      {
        id: "history",
        title: "Transaction History & Logs",
        file: "history.md",
        category: "💰 Financial Engine",
        icon: "📜"
      },
      {
        id: "credit_score",
        title: "Credit Score Assessment",
        file: "credit_score.md",
        category: "💰 Financial Engine",
        icon: "📈"
      },
      {
        id: "razorpay_backend_guide",
        title: "Razorpay Backend Integration",
        file: "razorpay_backend_guide.md",
        category: "💰 Financial Engine",
        icon: "💳"
      },
      {
        id: "build_and_release",
        title: "Build & Release CI/CD",
        file: "build_and_release.md",
        category: "⚙️ Platform & Services",
        icon: "🚀"
      },
      {
        id: "kyc",
        title: "KYC Verification & QR",
        file: "kyc.md",
        category: "⚙️ Platform & Services",
        icon: "🪪"
      },
      {
        id: "notification",
        title: "Notifications & Push Alerts",
        file: "notification.md",
        category: "⚙️ Platform & Services",
        icon: "🔔"
      },
      {
        id: "settings",
        title: "Settings & Preferences",
        file: "settings.md",
        category: "⚙️ Platform & Services",
        icon: "⚙️"
      },
      {
        id: "errors",
        title: "Errors & Offline Fallbacks",
        file: "errors.md",
        category: "⚙️ Platform & Services",
        icon: "🛡️"
      }
    ];

    // Navigation Stack for Back and Forth controls
    let historyStack = [];
    let historyIndex = -1;
    let currentDocId = "readme";

    // Initialize UI
    function init() {
      renderNavList();
      setupEventListeners();
      
      // Load initial doc from hash or default to readme
      const initialDocId = window.location.hash ? window.location.hash.substring(1) : "readme";
      navigateTo(initialDocId, false);
    }

    function renderNavList(filterText = "") {
      const navContainer = document.getElementById("nav-list");
      navContainer.innerHTML = "";

      let currentCategory = "";
      const query = filterText.toLowerCase().trim();

      DOCS_CATALOG.forEach(doc => {
        if (query && !doc.title.toLowerCase().includes(query) && !doc.category.toLowerCase().includes(query)) {
          return;
        }

        if (doc.category !== currentCategory) {
          currentCategory = doc.category;
          const catHeader = document.createElement("div");
          catHeader.className = "nav-category";
          catHeader.innerText = currentCategory;
          navContainer.appendChild(catHeader);
        }

        const navItem = document.createElement("a");
        navItem.className = `nav-item ${doc.id === currentDocId ? 'active' : ''}`;
        navItem.href = `#${doc.id}`;
        navItem.innerHTML = `<span class="icon">${doc.icon}</span> <span>${doc.title}</span>`;
        navItem.onclick = (e) => {
          e.preventDefault();
          navigateTo(doc.id);
        };
        navContainer.appendChild(navItem);
      });
    }

    async function navigateTo(docId, addToHistory = true) {
      const doc = DOCS_CATALOG.find(d => d.id === docId) || DOCS_CATALOG[0];
      currentDocId = doc.id;
      window.location.hash = doc.id;

      if (addToHistory) {
        historyStack = historyStack.slice(0, historyIndex + 1);
        historyStack.push(doc.id);
        historyIndex = historyStack.length - 1;
      } else if (historyIndex === -1) {
        historyStack.push(doc.id);
        historyIndex = 0;
      }

      updateHistoryButtons();
      updateBreadcrumbs(doc);
      renderNavList(document.getElementById("search-input").value);

      // Fetch and render document markdown
      await loadDocumentContent(doc);
      renderBottomNav(doc);

      // Scroll to top
      document.getElementById("content-pane").scrollTop = 0;
    }

    async function loadDocumentContent(doc) {
      const docContainer = document.getElementById("doc-content");
      docContainer.innerHTML = `<p style="color: var(--text-muted);">Loading ${doc.title}...</p>`;

      try {
        const response = await fetch(doc.file);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const markdown = await response.text();
        docContainer.innerHTML = marked.parse(markdown);
        
        // 1. Render Mermaid Diagrams
        docContainer.querySelectorAll('code.language-mermaid').forEach((el, index) => {
          const pre = el.parentElement;
          const div = document.createElement('div');
          div.className = 'mermaid';
          div.textContent = el.textContent;
          div.setAttribute('data-mermaid-src', el.textContent);
          pre.replaceWith(div);
        });
        if (window.mermaid) {
          mermaid.initialize({ startOnLoad: false, theme: getMermaidTheme() });
          await mermaid.run({
            nodes: docContainer.querySelectorAll('.mermaid')
          }).catch(e => console.error(e));
        }

        // Initialize Zoom for images and mermaid diagrams
        if (window.mediumZoom) {
          const bg = document.body.getAttribute('data-theme') === 'light' ? '#ffffff' : '#0F1115';
          mediumZoom(docContainer.querySelectorAll('img, .mermaid svg'), {
            margin: 24,
            background: bg
          });
        }

        // 2. Intercept Links (Downloads vs Navigation)
        docContainer.querySelectorAll('a').forEach(a => {
          a.addEventListener('click', (e) => {
            const href = a.getAttribute('href');
            if (!href) return;

            if (href.startsWith('#')) {
              // Same-page heading anchor
              e.preventDefault();
              const targetId = href.substring(1);
              const targetEl = document.getElementById(targetId);
              if (targetEl) {
                targetEl.scrollIntoView({ behavior: 'smooth' });
              }
            } else if (href.endsWith('.md') && !href.startsWith('http')) {
              // Internal navigation
              e.preventDefault();
              const targetDoc = DOCS_CATALOG.find(d => href.includes(d.file));
              if (targetDoc) {
                navigateTo(targetDoc.id);
              }
            } else {
              // Open downloads or external links cleanly without breaking the SPA
              a.setAttribute('target', '_blank');
              a.setAttribute('rel', 'noopener noreferrer');
            }
          });
        });
      } catch (err) {
        docContainer.innerHTML = `
          <h1>${doc.icon} ${doc.title}</h1>
          <blockquote>
            <strong>Developer Documentation View</strong><br>
            File path: <code>developer_docs/${doc.file}</code>
          </blockquote>
          <p>This document is located at <code>developer_docs/${doc.file}</code>. When viewing locally via browser security restrictions (CORS), open the markdown file directly in your editor or run <code>./developer_docs/launch.sh</code>.</p>
        `;
      }
    }

    function renderBottomNav(doc) {
      const bottomNav = document.getElementById("bottom-nav");
      bottomNav.innerHTML = "";

      const currentIndex = DOCS_CATALOG.findIndex(d => d.id === doc.id);
      const prevDoc = currentIndex > 0 ? DOCS_CATALOG[currentIndex - 1] : null;
      const nextDoc = currentIndex < DOCS_CATALOG.length - 1 ? DOCS_CATALOG[currentIndex + 1] : null;

      if (prevDoc) {
        const prevCard = document.createElement("div");
        prevCard.className = "nav-card prev";
        prevCard.innerHTML = `
          <div class="nav-card-label">← Previous</div>
          <div class="nav-card-title">${prevDoc.icon} ${prevDoc.title}</div>
        `;
        prevCard.onclick = () => navigateTo(prevDoc.id);
        bottomNav.appendChild(prevCard);
      } else {
        bottomNav.appendChild(document.createElement("div"));
      }

      if (nextDoc) {
        const nextCard = document.createElement("div");
        nextCard.className = "nav-card next";
        nextCard.innerHTML = `
          <div class="nav-card-label">Next →</div>
          <div class="nav-card-title">${nextDoc.title} ${nextDoc.icon}</div>
        `;
        nextCard.onclick = () => navigateTo(nextDoc.id);
        bottomNav.appendChild(nextCard);
      }
    }

    function updateHistoryButtons() {
      const btnBack = document.getElementById("btn-back");
      const btnForward = document.getElementById("btn-forward");

      btnBack.disabled = historyIndex <= 0;
      btnForward.disabled = historyIndex >= historyStack.length - 1;
    }

    function updateBreadcrumbs(doc) {
      document.getElementById("breadcrumb-current").innerText = doc.title;
    }

    function setupEventListeners() {
      // Back button
      document.getElementById("btn-back").addEventListener("click", () => {
        if (historyIndex > 0) {
          historyIndex--;
          navigateTo(historyStack[historyIndex], false);
        }
      });

      // Forward button
      document.getElementById("btn-forward").addEventListener("click", () => {
        if (historyIndex < historyStack.length - 1) {
          historyIndex++;
          navigateTo(historyStack[historyIndex], false);
        }
      });

      // Search input
      const searchInput = document.getElementById("search-input");
      searchInput.addEventListener("input", (e) => {
        renderNavList(e.target.value);
      });

      // Keyboard shortcuts
      window.addEventListener("keydown", (e) => {
        // Press "/" to search
        if (e.key === "/" && document.activeElement !== searchInput) {
          e.preventDefault();
          searchInput.focus();
        }
        // Alt + Left = Back
        if (e.altKey && e.key === "ArrowLeft" && historyIndex > 0) {
          historyIndex--;
          navigateTo(historyStack[historyIndex], false);
        }
        // Alt + Right = Forward
        if (e.altKey && e.key === "ArrowRight" && historyIndex < historyStack.length - 1) {
          historyIndex++;
          navigateTo(historyStack[historyIndex], false);
        }
      });

      // Light/Dark Theme toggle
      const themeToggle = document.getElementById("theme-toggle");
      themeToggle.addEventListener("click", () => {
        const isLight = document.body.getAttribute("data-theme") === "light";
        if (isLight) {
          document.body.removeAttribute("data-theme");
          document.getElementById("theme-icon").innerText = "🌙";
          document.getElementById("theme-text").innerText = "Dark";
        } else {
          document.body.setAttribute("data-theme", "light");
          document.getElementById("theme-icon").innerText = "☀️";
          document.getElementById("theme-text").innerText = "Light";
        }

        // Re-render Mermaid diagrams with the new theme
        if (window.mermaid) {
          const docContainer = document.getElementById("doc-content");
          const mermaidDivs = docContainer.querySelectorAll('.mermaid');
          if (mermaidDivs.length > 0) {
            mermaidDivs.forEach(div => {
              const svg = div.querySelector('svg');
              if (svg) {
                const source = div.getAttribute('data-mermaid-src') || div.textContent;
                div.removeAttribute('data-processed');
                div.innerHTML = source;
              }
            });
            mermaid.initialize({ startOnLoad: false, theme: getMermaidTheme() });
            mermaid.run({ nodes: mermaidDivs }).catch(e => console.error(e));
          }
        }
      });
    }

    window.onload = init;
  </script>
</body>
</html>
